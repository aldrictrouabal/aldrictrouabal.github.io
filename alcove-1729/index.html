<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alcôve 1729 · Ruinart · AT:D</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300&family=Hanken+Grotesk:wght@500&display=swap">
<link rel="preload" href="dark.webp" as="image">
<style>
:root{
  --night:#0f0f0e;
  --night-ink:#efeeea;
  --f-display:"Newsreader","Iowan Old Style","Georgia",serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--night-ink);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.stage{position:relative;aspect-ratio:1856/2304;height:min(100vh,calc(100vw * 2304 / 1856));max-width:100vw;overflow:hidden;background:var(--night);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.6s var(--ease)}
.stage.ready canvas{opacity:1}
.stage.entered{cursor:none;touch-action:none}
.stage.no-webgl{background:var(--night) url(lit.webp) center/cover no-repeat}
.enter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;border:0;margin:0;font:inherit;color:inherit;cursor:pointer;
  background:radial-gradient(ellipse at 50% 50%,rgba(15,15,14,.15) 0%,rgba(15,15,14,.55) 75%);
  transition:opacity 1.2s var(--ease),visibility 0s linear 1.2s}
.enter:focus-visible{outline:1px solid rgba(239,238,234,.5);outline-offset:-12px}
.stage.entered .enter{opacity:0;visibility:hidden;pointer-events:none}
.enter-t{font-family:var(--f-display);font-style:italic;font-weight:300;font-size:clamp(22px,4.2vmin,40px);line-height:1.2;letter-spacing:.005em;text-align:center;max-width:16em}
.enter-s{font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.62}
@media (prefers-reduced-motion:reduce){.stage canvas,.enter{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="alcove" aria-hidden="true"></canvas>
  <button class="enter" id="enter" type="button">
    <span class="enter-t" data-en="Find the engraved 1729 graffiti" data-fr="Trouvez le graffiti 1729 gravé"></span>
    <span class="enter-s" data-en="Click to enter" data-fr="Cliquez pour entrer" data-en-touch="Tap to enter" data-fr-touch="Touchez pour entrer"></span>
  </button>
</div>
<script type="module" src="alcove.js"></script>
</body>
</html>
